<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// 앱 아이콘 B안 (안드로이드 앱 아이콘과 같은 그림) + 위쪽 "WEB" 표시
//   ?s=크기  &mode=crop  : 안드로이드 런처에 실제로 보이는 가운데 부분만 (아이폰·일반 아이콘)
//            &mode=full  : 108 전체 (안드로이드 maskable 아이콘 — 런처가 앱과 똑같이 가운데를 잘라 보여 줌)
//            &web=0      : WEB 표시 없이
import { drawMongi, drawBall } from '../js/game/draw.js';
const q = new URLSearchParams(location.search);
const S = +(q.get('s') || 512);
const full = q.get('mode') === 'full';
const web = q.get('web') !== '0';
await new FontFace('Jua', 'url(../assets/jua.ttf)').load().then((f) => document.fonts.add(f));
const c = document.getElementById('c'); c.width = S; c.height = S;
const ctx = c.getContext('2d');
// 안드로이드 적응형 아이콘: 108 중 가운데 72 가 보인다
const view = full ? [0, 108] : [18, 72];
ctx.scale(S / view[1], S / view[1]);
ctx.translate(-view[0], -view[0]);
const g = ctx.createLinearGradient(0, 0, 0, 108); g.addColorStop(0, '#6ec3ff'); g.addColorStop(1, '#bfe8ff');
ctx.fillStyle = g; ctx.fillRect(0, 0, 108, 108);
ctx.fillStyle = 'rgba(255,255,255,0.22)';
for (let k = 0; k < 12; k++) {
  const a = k * Math.PI / 6, b = a + 0.2;
  ctx.beginPath(); ctx.moveTo(54, 54); ctx.lineTo(54 + Math.cos(a) * 90, 54 + Math.sin(a) * 90); ctx.lineTo(54 + Math.cos(b) * 90, 54 + Math.sin(b) * 90); ctx.closePath(); ctx.fill();
}
ctx.fillStyle = '#79d36b'; ctx.fillRect(0, 76.7, 108, 31.3);
ctx.fillStyle = 'rgba(43,33,80,0.25)'; ctx.fillRect(0, 76.7, 108, 1.7);
ctx.save();
ctx.translate(54, 54); ctx.scale(0.667, 0.667); ctx.translate(-54, -54);
drawMongi(ctx, 52, 90, 0.98, 0xffff4f64, { shadow: false });
drawBall(ctx, 80, 84, 10, 0);
ctx.restore();
if (web) {
  // 위쪽 가운데 "WEB" 딱지 (안드로이드 동그란 아이콘 안에도 들어가는 자리)
  const w = 30, h = 11.5, x = 54 - w / 2, y = 21.5;
  ctx.beginPath(); ctx.roundRect(x, y + 1.2, w, h, h / 2); ctx.fillStyle = '#2b2150'; ctx.fill();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fillStyle = '#ff4f64'; ctx.fill();
  ctx.lineWidth = 1.4; ctx.strokeStyle = '#2b2150'; ctx.stroke();
  ctx.font = '9px Jua'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 2; ctx.strokeStyle = '#2b2150'; ctx.strokeText('WEB', 54, y + h / 2 + 0.6);
  ctx.fillStyle = '#fff'; ctx.fillText('WEB', 54, y + h / 2 + 0.6);
}
document.title = 'done';
</script></body></html>
